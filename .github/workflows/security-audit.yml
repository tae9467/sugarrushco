name: Monthly security audit

on:
  schedule:
    - cron: "7 13 1 * *" # 1st of each month, 9:07 AM Eastern (13:07 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply safe dependency fixes
        working-directory: server
        run: |
          npm audit fix || true
          node --check index.js

      - name: Commit and push fixes if any
        run: |
          if ! git diff --quiet -- server/package.json server/package-lock.json; then
            git config user.name "Toula Elwell"
            git config user.email "70103989+tae9467@users.noreply.github.com"
            git add server/package.json server/package-lock.json
            git commit -m "Update server dependencies to patch vulnerabilities"
            git push
          fi

      - name: Report remaining vulnerabilities
        working-directory: server
        run: npm audit
